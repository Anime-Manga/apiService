name: On Pull Request Opened

on:
  pull_request:
    branches:
      - main
      - dev
jobs:
  test:
    runs-on: ubuntu-latest steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v4
      with:
        node-version: 22
    
    - name: Set CWD
      run: cd src
    
    - name: Install packages
      run: npm i

    - name: Check syntax code
      run: npm run eslint