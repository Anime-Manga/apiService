name: On Pull Request Opened

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-node@v4
      with:
        node-version: 22
    
    - name: Install packages
      run: npm i

    - name: Check syntax code
      run: npm run eslint